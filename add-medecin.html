<div class="container">
  <h2>Ajouter un Médecin :</h2>
  <div class="col-sm-6">
    <label>ID Médecin</label>
    <input type="number" class="form-control" name="idMedecin" [(ngModel)]="newMedecin.idMedecin" />

    <label>Nom Médecin</label>
    <input type="text" class="form-control" name="nomMedecin" [(ngModel)]="newMedecin.nomMedecin" />

    <label>Tarif Médecin</label>
    <input
      type="number"
      class="form-control"
      name="tarifMedecin"
      [(ngModel)]="newMedecin.tarifMedecin"
    />

    <label>Date Embauche</label>
    <input
      type="date"
      class="form-control"
      name="dateEmbauche"
      [(ngModel)]="newMedecin.dateEmbauche"
    />

    <label>Spécialité</label>
    <select class="form-control form-control-lg" id="idSpec" name="idSpec" [(ngModel)]="newIdSpec">
      @for (spec of specialites; track spec.idSpec) {
        <option [value]="spec.idSpec">{{ spec.nomSpec }}</option>
      }
    </select>

    <button class="btn btn-success mt-3" (click)="addMedecin()">Ajouter</button>
  </div>
</div>
